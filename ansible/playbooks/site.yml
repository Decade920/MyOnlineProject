- name: 在k3s_nodes上执行任务
  hosts: k3s_nodes
  become: yes
  tasks:
    - name: 安装 htop, curl, git
      package:
        name: "{{ item }}"
        state: present
      loop:
        - htop
        - curl
        - git
      when:
        - ansible_facts["os_family"] == "Debian"
  tags:
    - install_packages

- name: 测试幂等性
  hosts: k3s_nodes
  become: yes
  tasks:
    - name: 创建三个目录
      file:
        path: "/tmp/ansible-test-{{ item }}"
        state: directory
      loop:
        - kuuga
        - agito
        - ryuki
        - faiz
        - blade
        - hibiki
        - kabuto
        - den-o
        - kiva
        - decade
      when:
        - ansible_facts["os_family"] == "Debian"
  tags:
    - create_directories