- name: 在k3s_master上执行任务
  hosts: k3s_nodes
  become: yes
  vars:
    pkg_name: htop
  tasks:
    - name: Debian安装 {{ pkg_name }} 包
      apt:
        name: "{{ pkg_name }}"
        state: present
      when: ansible_os_family == 'Debian'

    - name: RedHat安装 {{ pkg_name }} 包
      yum:
        name: "{{ pkg_name }}"
        state: present
      when: ansible_os_family == 'RedHat'