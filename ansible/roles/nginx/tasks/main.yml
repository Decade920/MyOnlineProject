# yaml-language-server: $schema:https://raw.githubusercontent.com/ansible/ansible-lint/main/src/ansiblelint/schemas/ansible.json

- name: install nginx on k3s_nodes
  package:
    name: nginx
    state: present
  when:
    - ansible_facts["os_family"] == "Debian"

- name: render nginx.conf template
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
  notify: restart nginx

- name: check nginx conf syntax
  command: nginx -t
  changed_when: false
  when: not ansible_check_mode