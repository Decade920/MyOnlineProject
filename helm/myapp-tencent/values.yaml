# Default values for myapp.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
# yaml-language-server: $schema:none

global:
  namespace: default
  imagePullPolicy: IfNotPresent

debug:
  enabled: false
  image:
    repository: bitnami/kubectl
    tag: latest

# default 命名空间的服务配置
default:
  flask:
    replicaCount: 1
    image:
      repository: ccr.ccs.tencentyun.com/myapp-tencent/flask-app
      tag: v2
      pullSecrets:
        - tcr-secret
    service:
      port: 5000
    configmap:
      REDIS_HOST: redis-service
      DB_HOST: mysql-service
      DB_USER: root
      DB_NAME: myapp
      REDIS_PORT: "6379"
    secret:
      DB_PASSWORD: root123

  hello_consumer:
    replicaCount: 0
    image:
      repository: ccr.ccs.tencentyun.com/myapp-tencent/hello-consumer
      tag: v1
      pullSecrets:
        - tcr-secret

  nginx:
    replicaCount: 1
    image:
      repository: nginx
      tag: latest
    service:
      port: 80
      nodePort: 30001

  redis:
    replicaCount: 1
    image:
      repository: redis
      tag: alpine

  mysql:
    replicas: 1
    image:
      repository: mysql
      tag: "8.0"
    storage: 5Gi
    limitMemory: "600Mi"
    lowMemory: "256Mi"

  ingress:
    enabled: true
    host: myapp-tencent.139.199.13.221.sslip.io

# monitoring 命名空间的服务配置
monitoring:
  allEnabled: false
  prometheus:
    replicaCount: 1
    enabled: false
    image:
      repository: prom/prometheus
      tag: latest
    service:
      port: 9090
      nodePort: 32512

  grafana:
    replicaCount: 1
    enabled: false
    image:
      repository: grafana/grafana
      tag: latest
    service:
      port: 3000
      nodePort: 30306

  loki:
    replicas: 1
    image:
      repository: grafana/loki
      tag: latest
    service:
      port: 3100

  promtail:
    image:
      repository: grafana/promtail
      tag: latest
    config:
      lokiUrl: http://loki-service:3100/loki/api/v1/push

  rabbitmqExporter:
    replicaCount: 1
    image:
      repository: kbudde/rabbitmq-exporter
      tag: latest
    service:
      port: 9419


