# 生成一个nginx的deploment
# yaml-language-server: $schema:none
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: {{ .Values.default.nginx.relicaCount}}
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: "{{ .Values.default.nginx.image.repository}}:{{ .Values.default.nginx.image.tag}}"
        imagePullPolicy: "{{ .Values.global.imagePullPolicy}}"
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "64Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        ports:
        - containerPort: {{ .Values.default.nginx.service.port}}
        volumeMounts:
          - name: config
            mountPath: /etc/nginx/conf.d/default.conf
            subPath: default.conf
          - name: config
            mountPath: /usr/share/nginx/html/index.html
            subPath: index.html
      volumes:
        - name: config
          configMap:
            name: nginx-config
---
# 生成一个nginx的service
# yaml-language-server: $schema:none
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  selector:
    app: nginx
  ports:
    - port: {{ .Values.default.nginx.service.port}}
      targetPort: {{ .Values.default.nginx.service.port}}
      nodePort: {{ .Values.default.nginx.service.nodePort}}
  type: NodePort
---
# 生成一个nginx的configmap
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  default.conf: |
    server {
      listen 80;
      server_name localhost;
      location / {
        root /usr/share/nginx/html;
        index index.html;
      }

      location /api/ {
        proxy_pass http://flask-service:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }

      location /nginx_status/ {
        stub_status;
      }
    }
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>Hello from Nginx</title></head>
    <body>
        <h1>Hello from Nginx!</h1>
        <p>Visit <a href="/api/">/api/</a> to access the backend Flask app.</p>
    </body>
    </html>