{{- if .Values.monitoring.allEnabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-exporter-deployment
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-exporter
  template:
    metadata:
      labels:
        app: nginx-exporter
    spec:
      containers:
      - name: nginx-exporter
        image: nginx/nginx-prometheus-exporter
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9113
        args:
        - "--nginx.scrape-uri=http://nginx-service.default.svc.cluster.local/nginx_status/"
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-exporter-service
  namespace: monitoring
spec:
  selector:
    app: nginx-exporter
  ports:
    - port: 9113
      targetPort: 9113
  type: NodePort
{{- end }}