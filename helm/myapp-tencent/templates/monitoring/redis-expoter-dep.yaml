{{- if .Values.monitoring.allEnabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter-deployment
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
        promethus.io/scrape: "true"
        promethus.io/port: "9121"
    spec:
      containers:
      - name: redis-exporter
        image: oliver006/redis_exporter
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9121
        env:
        - name: REDIS_ADDR
          value: "redis-service.default.svc.cluster.local:6379"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter-service
  namespace: monitoring
spec:
  selector:
    app: redis-exporter
  ports:
  - port: 9121
    targetPort: 9121
  type: NodePort
{{- end }}