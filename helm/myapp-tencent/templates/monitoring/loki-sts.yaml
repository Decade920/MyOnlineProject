# yaml-language-server: $schema:none
{{- if .Values.monitoring.allEnabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: monitoring
spec:
  serviceName: loki-service
  selector:
    matchLabels:
      app: loki
  replicas: {{ .Values.monitoring.loki.replicas}}
  template:
    metadata:
      labels:
        app: loki
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      containers:
        - name: loki
          image: "{{ .Values.monitoring.loki.image.repository }}:{{ .Values.monitoring.loki.image.tag }}"
          imagePullPolicy: "{{ .Values.global.imagePullPolicy}}"
          args:
            - "-config.file=/etc/loki/loki.yaml"
          ports:
            - containerPort: {{ .Values.monitoring.loki.service.port }}
          volumeMounts:
            - name: loki-storage
              mountPath: /loki
            - name: config
              mountPath: /etc/loki
      volumes:
        - name: loki-storage
          hostPath:
            path: /tmp/loki-data
            type: DirectoryOrCreate
        - name: config
          configMap:
            name: loki-configmap
---
# 生成loki-service，使用ClusterIP
# yaml-language-server: $schema:none
apiVersion: v1
kind: Service
metadata:
  name: loki-service
  namespace: monitoring
spec:
  selector:
    app: loki
  ports:
    - port: {{ .Values.monitoring.loki.service.port }}
      targetPort: {{ .Values.monitoring.loki.service.port }}
  type: ClusterIP
---
# 生成loki-configmap，数据存到容器里的/loki目录下
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-configmap
  namespace: monitoring
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2020-10-24
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
    
    limits_config:
      retention_period: 168h

    ruler:
      alertmanager_url: http://localhost:9093
{{- end }}