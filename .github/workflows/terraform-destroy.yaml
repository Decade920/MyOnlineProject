name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to apply"
        required: true
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform/envs/${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: terraform/envs/${{ github.event.inputs.environment }}/.terraform
          key: terraform-${{ runner.os }}-${{ github.event.inputs.environment }}-${{ hashFiles(format('terraform/envs/{0}/.terraform.lock.hcl', github.event.inputs.environment)) }}
          restore-keys: |
            terraform-${{ runner.os }}-${{ github.event.inputs.environment }}-

      - name: Terraform Init
        run: terraform init
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TENCENTCLOUD_REGION: ap-guangzhou

      - name: Terraform Plan Destroy
        run: terraform plan -destroy -no-color -out=tfplan
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TENCENTCLOUD_REGION: ap-guangzhou

      - name: Terraform Destroy
        run: terraform apply tfplan
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TENCENTCLOUD_REGION: ap-guangzhou
