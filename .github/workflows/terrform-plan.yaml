name: Terraform Plan
on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/**"

  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/**"

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, prod]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: terraform/envs/${{ matrix.env }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3

      - name: Cache Terraform Providers
        uses: actions/cache@v4
        with:
          path: terraform/envs/${{ matrix.env }}/.terraform
          key: terraform-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles(format('terraform/envs/{0}/.terraform.lock.hcl', matrix.env)) }}
          restore-keys: |
            terraform-${{ runner.os }}-${{ matrix.env }}-

      - name: Terraform Init
        run: terraform init
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TENCENTCLOUD_REGION: ap-guangzhou

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color -lock-timeout=5m
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TENCENTCLOUD_REGION: ap-guangzhou
