name: Terraform Apply

on:
  workflow_dispatch:

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, prod]
    environment: production
    defaults:
      run:
        working-directory: terraform/envs/${{ matrix.env }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3

      - name: Cache Terraform Providers
        uses: actions/cache@v4
        with:
          path: terraform/envs/${{ matrix.env }}/.terraform
          key: terraform-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles(format('terraform/envs/{0}/.terraform.lock.hcl', matrix.env)) }}
          restore-keys: |
            terraform-${{ runner.os }}-${{ matrix.env }}-

      - name: Terraform Init
        run: terraform init
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TENCENTCLOUD_REGION: ap-guangzhou

      - name: Terraform Plan
        run: terraform plan -no-color -lock-timeout=5m -out=tfplan
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TENCENTCLOUD_REGION: ap-guangzhou
      
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TENCENTCLOUD_REGION: ap-guangzhou
